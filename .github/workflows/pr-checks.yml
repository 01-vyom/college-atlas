name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: JavaScript syntax checks
        run: |
          node --check assets/app.js
          node --check assets/report-page.js
      - name: Python syntax checks
        run: |
          python -m py_compile src/college_matcher.py src/build_site_data.py
      - name: Verify required static files
        run: |
          test -f index.html
          test -f best-plan.html
          test -f college-table.html
          test -f outputs/college_shortlist.csv
          test -f outputs/deeper_college_recommendations.md
